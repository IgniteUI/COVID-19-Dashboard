<app-splashscreen [class]="splashClass()" />
<div [class.app-dark-theme]="darkTheme()" [class.app-light-theme]="!darkTheme()">
  <app-header (themeChanged)="toggleTheme()" />
  <app-main
    [darkTheme]="darkTheme()"
    (updateTimeRetrieved)="onUpdateTimeRetrieved($event)"
    (messageEvent)="onDataReceived($event)" />
  <app-footer [lastUpdate]="lastUpdate()" />
</div>
