<footer class="app__footer">
  <div class="app__footer-item">
    <span>Last updated at:</span>
    @if (lastUpdate(); as updatedAt) {
      <time [attr.datetime]="lastUpdateIso()">{{ updatedAt | date: 'medium' }}</time>
    } @else {
      <span>Loading…</span>
    }
  </div>

  <div class="app__footer-item app__footer-item--info">
    <span>
      Data source:
      <a href="https://github.com/CSSEGISandData/COVID-19" target="_blank" rel="noopener noreferrer">
        Johns Hopkins CSSE
      </a>
    </span>
    <a
      class="footerLogo"
      href="https://www.infragistics.com/products/ignite-ui-angular"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Ignite UI for Angular">
      <img
        class="footerLogo__dark"
        ngSrc="assets/ignite-ui-logo-2019-powered-by-on-dark-horizontal.svg"
        width="249"
        height="38"
        alt="" />
      <img
        class="footerLogo__light"
        ngSrc="assets/ignite-ui-logo-2019-powered-by-on-light-horizontal.svg"
        width="249"
        height="38"
        alt="" />
    </a>
  </div>
</footer>
