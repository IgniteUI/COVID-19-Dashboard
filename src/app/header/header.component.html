<header class="app__header">
  <igx-navbar [isActionButtonVisible]="true" title="Coronavirus COVID-19 Global Cases">
    <igx-navbar-action>
      <img
        class="app__brand-logo"
        ngSrc="assets/Infragistics-horizontal-use-against-dark.svg"
        width="150"
        height="21"
        alt="Infragistics" />
    </igx-navbar-action>
    <button
      class="app__theme-icon-button"
      type="button"
      aria-label="Toggle color theme"
      igxIconButton="flat"
      [igxTooltipTarget]="tooltipRef"
      (click)="themeChanged.emit()">
      <igx-icon>{{ icon }}</igx-icon>
    </button>
  </igx-navbar>
</header>
<div #tooltipRef="tooltip" igxTooltip>Toggle color theme</div>
