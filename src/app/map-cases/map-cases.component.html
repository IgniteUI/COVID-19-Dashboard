<div class="app__map-inner">
  <igx-buttongroup
    class="app__map-button-group"
    aria-label="Map data set"
    (selected)="onDataSetSelected($event)">
    @for (button of dataSetButtons; track button.name) {
      <button type="button" igxButton [selected]="button.selected">
        <span class="ellipsis">{{ button.name }}</span>
      </button>
    }
  </igx-buttongroup>

  <igx-geographic-map
    #map
    class="app__map"
    aria-label="Global COVID-19 case map"
    [zoomable]="true"
    (seriesMouseLeftButtonUp)="onSeriesClicked($event)" />
</div>

<ng-template #template let-item="item">
  <div class="app__map-tooltip">
    @if (showRegion(item)) {
      <h2>{{ item.region }}, {{ item.country }}</h2>
    } @else {
      <h2>{{ item.country }}</h2>
    }
    <ul class="app__map-tooltip-list">
      <li class="infected">
        Infected: <span>{{ getTotalInfectedForCountry(item) | number }}</span>
      </li>
      <li class="deaths">
        Deaths: <span>{{ getTotalDeathsForCountry(item) | number }}</span>
      </li>
    </ul>
  </div>
</ng-template>
