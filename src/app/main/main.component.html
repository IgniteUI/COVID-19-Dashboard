<main class="app__main-inner">
    <div class="app__row app__row--left">
      <app-list-cases
        class="app__list--confirmed"
        type="Confirmed"
        [data]="confirmedCases()"
        (regionSelected)="onRegionSelected($event)" />
      <section class="app__col app__col--map">
        <h1 class="app__mobile-header">Coronavirus <strong>COVID-19</strong> Global Cases</h1>

        <app-map-cases [data]="worldData()" [darkTheme]="darkTheme()" />
      </section>
    </div>

    <div class="app__col app__col--stats">
        <div class="app__row app__list-stack">
            <app-list-cases
              class="app__list--deaths"
              type="Deaths"
              [data]="deaths()"
              (regionSelected)="onRegionSelected($event)" />
        </div>
        <app-timeline-chart
          class="app-timeline-chart"
          [csvData]="confirmedCsv()"
          [darkTheme]="darkTheme()" />
    </div>
</main>
